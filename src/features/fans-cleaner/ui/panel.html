<div id="bk-cleaner-root" x-cloak>
  <button class="bk-float-btn" type="button" @click="togglePanel()">
    <span>🧹</span>
    <span>粉丝清理</span>
  </button>

  <div class="bk-overlay" x-show="panelOpen" x-transition.opacity @click="closePanel()"></div>

  <section class="bk-panel" x-show="panelOpen" x-transition>
    <header class="bk-header">
      <div class="bk-title-wrap">
        <div class="bk-title">粉丝清理大师</div>
        <div class="bk-subtitle">TypeScript + Alpine.js</div>
      </div>
      <button class="bk-close-btn" type="button" @click="closePanel()">×</button>
    </header>

    <div class="bk-toolbar">
      <button class="bk-action-btn primary" type="button" @click="refreshCurrentPage()" :disabled="isBusy || actionsDisabled" :title="actionsDisabled ? '仅支持当前登录用户自己的个人空间' : ''">
        刷新列表
      </button>
      <button class="bk-action-btn warning" type="button" @click="loadAllFans()" :disabled="isBusy || actionsDisabled" :title="actionsDisabled ? '仅支持当前登录用户自己的个人空间' : ''">
        全部加载
      </button>
      <button class="bk-action-btn ghost" type="button" @click="toggleSettings()">
        设置
      </button>
      <button class="bk-action-btn secondary" type="button" @click="kickNonMutualFans()" :disabled="isBusy || actionsDisabled" :title="actionsDisabled ? '仅支持当前登录用户自己的个人空间' : ''">
        移除非互粉
      </button>
      <button class="bk-action-btn accent" type="button" @click="toggleSelectAll()" :disabled="fans.length === 0 || isBusy || actionsDisabled" :title="actionsDisabled ? '仅支持当前登录用户自己的个人空间' : ''">
        全选列表
      </button>
      <button class="bk-action-btn danger" type="button" @click="kickSelectedFans()" :disabled="selectedFanIds.length === 0 || isBusy || actionsDisabled" :title="actionsDisabled ? '仅支持当前登录用户自己的个人空间' : ''">
        一键移除
      </button>
      <span class="bk-status-bar" x-text="statusBar"></span>
    </div>

    <section class="bk-settings-card" x-show="settingsOpen" x-transition>
      <div class="bk-settings-grid">
        <label class="bk-field">
          <span>每页数量</span>
          <input type="number" min="1" step="1" x-model.number="config.pageSize" />
        </label>
        <label class="bk-field">
          <span>移除间隔(ms)</span>
          <input type="number" min="1" step="100" x-model.number="config.removeDelayMs" />
        </label>
        <label class="bk-field">
          <span>批量拉取最短间隔(ms)</span>
          <input type="number" min="1" step="100" x-model.number="config.bulkFetchDelayMinMs" />
        </label>
        <label class="bk-field">
          <span>批量拉取最长间隔(ms)</span>
          <input type="number" min="1" step="100" x-model.number="config.bulkFetchDelayMaxMs" />
        </label>
      </div>
      <div class="bk-settings-hint">
        保存后对后续请求生效，并写入油猴存储。
      </div>
      <div class="bk-settings-actions">
        <button class="bk-action-btn primary" type="button" @click="saveSettings()" :disabled="savingSettings">
          保存设置
        </button>
        <button class="bk-action-btn ghost" type="button" @click="resetSettings()" :disabled="savingSettings">
          恢复默认
        </button>
      </div>
    </section>

    <div class="bk-list" id="bk-list-scroll" @scroll.passive="handleListScroll()">
      <template x-if="actionsDisabled">
        <div class="bk-info-card">
          <h3>仅支持当前登录用户自己的个人空间</h3>
          <p>当前页面不是当前登录账号的个人空间，面板可查看但操作按钮已禁用。</p>
        </div>
      </template>

      <template x-if="requiresRiskVerification">
        <div class="bk-alert-card">
          <h3>触发 Bilibili 风控验证 (-352)</h3>
          <p>请在新页面中完成验证，然后回来重新刷新。</p>
          <a href="https://t.bilibili.com/" target="_blank" rel="noreferrer">去通过验证</a>
        </div>
      </template>

      <template x-if="errorMessage && !requiresRiskVerification">
        <div class="bk-alert-card" x-text="errorMessage"></div>
      </template>

      <template x-if="!requiresRiskVerification && !errorMessage && fans.length === 0">
        <div class="bk-empty-state" x-text="loading ? '正在加载粉丝数据...' : '请点击刷新本页获取数据...'"></div>
      </template>

      <div class="bk-items" x-show="fans.length > 0">
        <div class="bk-spacer" :style="`height:${topSpacerHeight}px`"></div>
        <template x-for="fan in visibleFans" :key="fan.mid">
          <label class="bk-item" :class="{ 'is-removed': isRemoved(fan.mid) }">
            <input type="checkbox" :value="String(fan.mid)" x-model="selectedFanIds" />
            <img class="bk-avatar" :src="fan.face" :alt="fan.uname" loading="lazy" />
            <div>
              <div class="bk-item-name" x-text="fan.uname"></div>
              <div class="bk-item-sign" x-text="fan.sign || '无签名'"></div>
            </div>
            <div class="bk-status" :class="statusToneClass(fan.mid)" :title="statusTitle(fan.mid)" x-text="statusText(fan.mid)"></div>
          </label>
        </template>
        <div class="bk-spacer" :style="`height:${bottomSpacerHeight}px`"></div>
      </div>
    </div>

    <footer class="bk-footer">
      <span class="bk-page-info" x-text="pageInfo"></span>
    </footer>
  </section>
</div>
